<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="leise releases — signed builds, checked before they install">
  <title>leise releases — signed builds, checked before they install</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M40 0H0V40" fill="none"/>
    </pattern>
    <path id="plus" d="M-7 0H7M0-7V7"/>
  </defs>
  <style>
    .bg   { fill: #ffffff; }
    .grid { stroke: rgb(0 0 0 / 5%); stroke-width: 1; }
    .card { fill: #ffffff; stroke: rgb(0 0 0 / 14%); }
    .line { stroke: rgb(0 0 0 / 9%); }
    .track { fill: rgb(0 0 0 / 7%); }
    .mark { stroke: #a8a8a8; }
    .fg   { fill: #171717; }
    .ink  { stroke: #171717; }
    .mut  { fill: #4d4d4d; }
    .smut { stroke: #4d4d4d; }
    .dim  { fill: #8f8f8f; }
    .arc1 { stroke: #666666; }
    .arc2 { stroke: #c2c2c2; }
    .pill { fill: rgb(0 0 0 / 3%); stroke: rgb(0 0 0 / 12%); }
    .tile { fill: #f2f2f2; }
    .focus { fill: #006be0; }
    .sfocus { stroke: #006be0; }
    svg { --focus: #006be0; }

    .sans { font-family: Geist, 'Geist Sans', Inter, 'Inter Display', ui-sans-serif, system-ui, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }

    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .m1c { animation-name: m1c; }
    .m1p { animation-name: m1p; opacity: 0; }
    .s1  { animation-name: s1; animation-timing-function: linear; opacity: 0; }
    .bar { animation-name: bar; transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); }
    .m2p { animation-name: m2p; opacity: 0; }
    .m3c { animation-name: m3c; }
    .m3p { animation-name: m3p; opacity: 0; }
    .s3  { animation-name: s3; animation-timing-function: linear; opacity: 0; }
    .hc  { animation-name: hc; }
    .hp  { animation-name: hp; opacity: 0; }
    .dot  { animation: pulse 3s ease-in-out infinite; }
    .wave1 { animation: wave 3s ease-in-out infinite; }
    .wave2 { animation: wave 3s ease-in-out -0.5s infinite; }

    /* 0-8 checking · 8-14 manifest found · 16-44 download · 48-56 signature · 60-88 ready · 90-100 reset */
    @keyframes m1c { 0%, 8% { opacity: 1; } 14%, 88% { opacity: 0; } 96%, 100% { opacity: 1; } }
    @keyframes m1p { 0%, 8% { opacity: 0; } 14%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes s1 {
      0%, 7.9% { opacity: 0; transform: translateX(0); }
      8%       { opacity: 1; transform: translateX(0); }
      14%      { opacity: 1; transform: translateX(196px); }
      14.1%, 100% { opacity: 0; transform: translateX(196px); }
    }
    @keyframes bar {
      0%, 16% { transform: scaleX(0); opacity: 1; }
      44%, 88% { transform: scaleX(1); opacity: 1; }
      96% { transform: scaleX(1); opacity: 0; }
      100% { transform: scaleX(0); opacity: 0; }
    }
    @keyframes m2p { 0%, 44% { opacity: 0; } 47%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes m3c { 0%, 48% { opacity: 1; } 56%, 88% { opacity: 0; } 96%, 100% { opacity: 1; } }
    @keyframes m3p { 0%, 48% { opacity: 0; } 56%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes s3 {
      0%, 47.9% { opacity: 0; transform: translateX(0); }
      48%       { opacity: 1; transform: translateX(0); }
      56%       { opacity: 1; transform: translateX(196px); }
      56.1%, 100% { opacity: 0; transform: translateX(196px); }
    }
    @keyframes hc { 0%, 58% { opacity: 1; } 62%, 88% { opacity: 0; } 96%, 100% { opacity: 1; } }
    @keyframes hp { 0%, 58% { opacity: 0; } 62%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes wave  { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .a, .dot, .wave1, .wave2 { animation: none; }
      .m1c, .m3c, .hc, .s1, .s3 { opacity: 0; }
      .m1p, .m2p, .m3p, .hp { opacity: 1; }
      .bar { transform: none; }
    }
  </style>

  <rect class="bg" width="1200" height="340"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <rect class="card" x="48.5" y="40.5" width="1103" height="259" rx="6"/>
  <g class="mark" fill="none">
    <use href="#plus" x="48.5" y="40.5"/><use href="#plus" x="1151.5" y="40.5"/>
    <use href="#plus" x="48.5" y="299.5"/><use href="#plus" x="1151.5" y="299.5"/>
  </g>

  <!-- the logo mark: assets/logo.svg without its tile -->
  <g transform="translate(76 92) scale(0.56)" fill="none">
    <path class="ink" d="M60 64h136v100H110l-34 30v-30H60z" stroke-width="14"/>
    <rect class="fg" x="88" y="104" width="20" height="20"/>
    <path class="arc1 wave1" d="M128 96a22 22 0 0 1 0 36" stroke-width="10"/>
    <path class="arc2 wave2" d="M148 84a40 40 0 0 1 0 60" stroke-width="10"/>
  </g>

  <g transform="translate(232 82)">
    <rect class="pill" x="0.5" y="0.5" width="276" height="27" rx="13.5"/>
    <rect class="fg dot" x="14" y="10" width="8" height="8"/>
    <text class="mono mut" x="32" y="18.5" font-size="12" letter-spacing="1.6">RELEASES · WINDOWS · LINUX</text>
  </g>
  <text class="sans fg" x="226" y="204" font-size="96" font-weight="600" letter-spacing="-4">leise</text>
  <text class="sans mut" x="231" y="246" font-size="21">signed builds, checked before they install</text>

  <!-- an update arriving: found, downloaded, its signature checked against the built-in key -->
  <path class="line" d="M792.5 64V276M816 104.5H1120"/>
  <text class="mono mut" x="816" y="90" font-size="13"># updates</text>
  <text class="mono dim a hc" x="1120" y="90" font-size="12" text-anchor="end">checking…</text>
  <text class="mono a hp" x="1120" y="90" font-size="12" text-anchor="end"><tspan class="focus">ready · restart to apply</tspan></text>

  <g class="mono" font-size="15">
    <rect class="tile" x="816" y="120" width="30" height="30" rx="4"/>
    <path class="smut" d="M826.5 127.5h7l4 4v11h-11z M833.5 127.5v4h4" fill="none" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="dim" x="860" y="131" font-size="12">latest.json</text>
    <text class="dim a m1c" x="860" y="151">checking for updates</text>
    <text class="fg a m1p" x="860" y="151">new version available</text>
    <rect class="focus a s1" x="860" y="138" width="2" height="17"/>

    <rect class="tile" x="816" y="172" width="30" height="30" rx="4"/>
    <path class="smut" d="M831 179v13 M826 187l5 5 5-5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="dim" x="860" y="183" font-size="12">Leise_amd64.AppImage</text>
    <text class="dim a m2p" x="1120" y="183" font-size="12" text-anchor="end">done</text>
    <rect class="track" x="860" y="195" width="260" height="4" rx="2"/>
    <rect class="focus a bar" x="860" y="195" width="260" height="4" rx="2"/>

    <rect class="tile" x="816" y="224" width="30" height="30" rx="4"/>
    <path class="smut" d="M825.5 239.5l4 4 7.5-8" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="dim" x="860" y="235" font-size="12">minisign</text>
    <text class="dim a m3c" x="860" y="255">9c1e 7a d04 b2f8 61ce</text>
    <text class="fg a m3p" x="860" y="255">signature ok · DBE889EA</text>
    <rect class="focus a s3" x="860" y="242" width="2" height="17"/>
  </g>
</svg>
